openapi: 3.0.3
info:
  title: Sistem Surat API
  version: 1.0.0
  description: API untuk manajemen surat masuk, register PI, departemen, dan user.

servers:
  - url: http://localhost:3001
    description: Development server

tags:
  - name: Surat
    description: Register surat masuk dan PI
  - name: Cetak
    description: Data untuk keperluan cetak
  - name: Departemen
    description: Master data departemen
  - name: Users
    description: Manajemen user (Admin only)
  - name: Auth
    description: Autentikasi

paths:
  /api/auth/{all}:
    get:
      tags: [Auth]
      summary: Auth handler (Better Auth)
      parameters:
        - in: path
          name: all
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    post:
      tags: [Auth]
      summary: Auth handler (Better Auth)
      parameters:
        - in: path
          name: all
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK

  /api/surat:
    get:
      tags: [Surat]
      summary: Ambil semua register surat atau PI
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [pi]
          description: Jika "pi" ambil RegisterPI, selain itu RegisterSurat
        - in: query
          name: ids
          schema:
            type: string
            example: "1,2,3"
          description: Filter ID comma-separated
      responses:
        "200":
          description: Daftar register
        "500":
          description: Internal Server Error
    post:
      tags: [Surat]
      summary: Tambah register surat baru (Surat biasa atau PI)
      description: >
        Jika `deptId` = `"PI"` maka simpan sebagai RegisterPI (butuh `piList`),
        selain itu RegisterSurat (butuh `suratList`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PostSuratBody"
                - $ref: "#/components/schemas/PostPIBody"
            examples:
              surat:
                summary: Register Surat biasa
                value:
                  deptId: HRD
                  asalSurat: PT Maju Jaya
                  tujuan: HRD
                  tanggalTerima: "2026-05-01"
                  suratList:
                    - perihal: Permohonan Kerjasama
                      noSurat: 001/MJ/V/2026
                      lampiran: 1 berkas
                      tanggalSurat: "2026-04-28"
              pi:
                summary: Register PI
                value:
                  deptId: PI
                  asalSurat: PT Supplier ABC
                  tanggalTerima: "2026-05-01"
                  piList:
                    - namaSupplier: PT Supplier ABC
                      noInvoice: INV-001
                      nomorSurat: S-001/ABC/V/2026
                      tujuan: PI
                      cc: null
                      tanggalSurat: "2026-04-30"
      responses:
        "201":
          description: Register berhasil dibuat
        "400":
          description: Field wajib tidak lengkap
        "404":
          description: Departemen tidak ditemukan
        "409":
          description: Nomor sudah ada
        "500":
          description: Internal Server Error

  /api/surat/{dept}/{id}:
    parameters:
      - in: path
        name: dept
        required: true
        schema:
          type: string
          example: HRD
        description: ID departemen (gunakan "PI" untuk register PI)
      - in: path
        name: id
        required: true
        schema:
          type: integer
          example: 1
        description: ID register
    get:
      tags: [Surat]
      summary: Ambil detail satu register
      responses:
        "200":
          description: Detail register
        "400":
          description: ID tidak valid
        "404":
          description: Data tidak ditemukan
        "500":
          description: Internal Server Error
    patch:
      tags: [Surat]
      summary: Update register surat atau PI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PatchSuratBody"
                - $ref: "#/components/schemas/PatchPIBody"
            examples:
              surat:
                summary: Update Surat
                value:
                  asalSurat: PT Update
                  tujuan: HRD
                  tanggalTerima: "2026-05-02"
                  suratList:
                    - perihal: Perihal baru
                      noSurat: 002/MJ/V/2026
                      lampiran: 2 berkas
                      tanggalSurat: "2026-05-01"
              pi:
                summary: Update PI
                value:
                  asalSurat: PT Update
                  tanggalTerima: "2026-05-02"
                  piList:
                    - namaSupplier: PT Update
                      noInvoice: INV-002
                      nomorSurat: S-002/V/2026
                      tujuan: PI
                      cc: null
                      tanggalSurat: "2026-05-01"
      responses:
        "200":
          description: Berhasil diupdate
        "400":
          description: ID tidak valid
        "404":
          description: Data tidak ditemukan
        "500":
          description: Internal Server Error
    delete:
      tags: [Surat]
      summary: Hapus register surat atau PI
      responses:
        "200":
          description: Berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "400":
          description: ID tidak valid
        "404":
          description: Data tidak ditemukan
        "500":
          description: Internal Server Error

  /api/surat/next-nomor:
    get:
      tags: [Surat]
      summary: Nomor register berikutnya
      parameters:
        - in: query
          name: deptId
          required: true
          schema:
            type: string
            example: HRD
      responses:
        "200":
          description: Nomor berikutnya
          content:
            application/json:
              schema:
                type: object
                properties:
                  nomor:
                    type: string
                    example: "0005"
                    nullable: true

  /api/surat/preview-nomor:
    get:
      tags: [Surat]
      summary: Preview nomor register berikutnya
      parameters:
        - in: query
          name: deptId
          required: true
          schema:
            type: string
            example: HRD
      responses:
        "200":
          description: Preview nomor
          content:
            application/json:
              schema:
                type: object
                properties:
                  nomor:
                    type: string
                    example: "0005"
                    nullable: true

  /api/cetak/all:
    get:
      tags: [Cetak]
      summary: Data RegisterSurat untuk cetak
      parameters:
        - in: query
          name: ids
          schema:
            type: string
            example: "1,2,3"
          description: Filter ID comma-separated. Kosong = ambil semua.
      responses:
        "200":
          description: Daftar RegisterSurat
        "500":
          description: Internal Server Error

  /api/cetak/pi:
    get:
      tags: [Cetak]
      summary: Data RegisterPI untuk cetak
      parameters:
        - in: query
          name: ids
          schema:
            type: string
            example: "1,2,3"
          description: Filter ID comma-separated. Kosong = ambil semua.
      responses:
        "200":
          description: Daftar RegisterPI
        "500":
          description: Internal Server Error

  /api/dept:
    get:
      tags: [Departemen]
      summary: Ambil semua departemen aktif
      responses:
        "200":
          description: Daftar departemen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
        "500":
          description: Internal Server Error

  /api/users:
    post:
      tags: [Users]
      summary: Buat user baru (Admin only)
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
            example:
              name: Budi Santoso
              email: budi@example.com
              username: budi
              password: rahasia123
              role: STAFF
      responses:
        "200":
          description: User berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Username atau email sudah dipakai
        "401":
          description: Unauthorized — hanya ADMIN

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token

  schemas:
    Department:
      type: object
      properties:
        id:
          type: string
          example: HRD
        shortName:
          type: string
          example: HRD
        tujuan:
          type: string
          example: Kepala HRD
          nullable: true

    DetailSurat:
      type: object
      properties:
        id:
          type: integer
          example: 1
        perihal:
          type: string
          example: Permohonan Kerjasama
        noSurat:
          type: string
          example: 001/MJ/V/2026
          nullable: true
        lampiran:
          type: string
          example: 1 berkas
          nullable: true
        tanggalSurat:
          type: string
          format: date-time
          example: "2026-04-28T00:00:00.000Z"

    RegisterSurat:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nomor:
          type: string
          example: "0001"
        deptId:
          type: string
          example: HRD
        asalSurat:
          type: string
          example: PT Maju Jaya
        tujuan:
          type: string
          example: HRD
        tanggalTerima:
          type: string
          format: date-time
          example: "2026-05-01T00:00:00.000Z"
        dept:
          $ref: "#/components/schemas/Department"
        detailSurat:
          type: array
          items:
            $ref: "#/components/schemas/DetailSurat"

    DetailPI:
      type: object
      properties:
        id:
          type: integer
          example: 1
        namaSupplier:
          type: string
          example: PT Supplier ABC
        noInvoice:
          type: string
          example: INV-001
          nullable: true
        nomorSurat:
          type: string
          example: S-001/ABC/V/2026
          nullable: true
        tujuan:
          type: string
          example: PI
          nullable: true
        cc:
          type: string
          example: null
          nullable: true
        tanggalSurat:
          type: string
          format: date-time
          example: "2026-04-30T00:00:00.000Z"

    RegisterPI:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nomor:
          type: string
          example: "0001"
        deptId:
          type: string
          example: PI
        asalSurat:
          type: string
          example: PT Supplier ABC
        tanggalTerima:
          type: string
          format: date-time
          example: "2026-05-01T00:00:00.000Z"
        dept:
          $ref: "#/components/schemas/Department"
        detailPI:
          type: array
          items:
            $ref: "#/components/schemas/DetailPI"

    PostSuratBody:
      type: object
      required: [deptId, asalSurat, tanggalTerima, suratList]
      properties:
        deptId:
          type: string
          example: HRD
        asalSurat:
          type: string
          example: PT Maju Jaya
        tujuan:
          type: string
          example: HRD
        tanggalTerima:
          type: string
          format: date
          example: "2026-05-01"
        suratList:
          type: array
          minItems: 1
          items:
            type: object
            required: [perihal, tanggalSurat]
            properties:
              perihal:
                type: string
                example: Permohonan Kerjasama
              noSurat:
                type: string
                example: 001/MJ/V/2026
                nullable: true
              lampiran:
                type: string
                example: 1 berkas
                nullable: true
              tanggalSurat:
                type: string
                format: date
                example: "2026-04-28"

    PostPIBody:
      type: object
      required: [deptId, asalSurat, tanggalTerima, piList]
      properties:
        deptId:
          type: string
          example: PI
        asalSurat:
          type: string
          example: PT Supplier ABC
        tanggalTerima:
          type: string
          format: date
          example: "2026-05-01"
        piList:
          type: array
          minItems: 1
          items:
            type: object
            required: [namaSupplier, tanggalSurat]
            properties:
              namaSupplier:
                type: string
                example: PT Supplier ABC
              noInvoice:
                type: string
                example: INV-001
                nullable: true
              nomorSurat:
                type: string
                example: S-001/ABC/V/2026
                nullable: true
              tujuan:
                type: string
                example: PI
                nullable: true
              cc:
                type: string
                example: null
                nullable: true
              tanggalSurat:
                type: string
                format: date
                example: "2026-04-30"

    PatchSuratBody:
      type: object
      properties:
        asalSurat:
          type: string
        tujuan:
          type: string
        tanggalTerima:
          type: string
          format: date
        suratList:
          type: array
          items:
            type: object
            properties:
              perihal:
                type: string
              noSurat:
                type: string
                nullable: true
              lampiran:
                type: string
                nullable: true
              tanggalSurat:
                type: string
                format: date

    PatchPIBody:
      type: object
      properties:
        asalSurat:
          type: string
        tanggalTerima:
          type: string
          format: date
        piList:
          type: array
          items:
            type: object
            properties:
              namaSupplier:
                type: string
              noInvoice:
                type: string
                nullable: true
              nomorSurat:
                type: string
                nullable: true
              tujuan:
                type: string
                nullable: true
              cc:
                type: string
                nullable: true
              tanggalSurat:
                type: string
                format: date

    CreateUserBody:
      type: object
      required: [name, email, username, password, role]
      properties:
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: budi@example.com
        username:
          type: string
          example: budi
        password:
          type: string
          format: password
          example: rahasia123
        role:
          type: string
          enum: [ADMIN, STAFF, PKL]
          example: STAFF

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          example: budi@example.com
        username:
          type: string
          example: budi
        role:
          type: string
          example: STAFF