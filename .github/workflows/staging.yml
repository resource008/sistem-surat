name: Staging Deployment

on:
  push:
    branches:
      - staging

jobs:
  # 1. Build & Push Image ke Docker Hub (Dijalankan di Cloud GitHub)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sistem-surat:staging
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Deploy Langsung dari VPS (Dijalankan oleh Runner Lokal)
  deploy:
    name: Pembaruan Container di VPS
    needs: build-and-push
    runs-on: [self-hosted, vps-staging]
    steps:
      - name: Eksekusi Update Container & Prisma Migration
        run: |
          cd /var/www/docker-staging
          
          # Login ke Docker Hub dari dalam VPS
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          
          # Pull image terbaru
          docker compose -f docker-compose.staging.yml pull
          
          # Jalankan migrasi database Prisma
          docker compose -f docker-compose.staging.yml run --rm web_app npx prisma migrate deploy
          
          # Restart container web_app
          docker compose -f docker-compose.staging.yml up -d
          
          # Bersihkan image lama yang tidak terpakai
          docker image prune -f