name: Staging Deployment

on:
  push:
    branches:
      - staging

jobs:
  # 1. Build & Push Image ke Docker Hub (Dijalankan di Cloud GitHub)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sistem-surat:staging
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Deploy Langsung dari VPS (Dijalankan oleh Runner Lokal)
  deploy:
    name: Pembaruan Container di VPS
    needs: build-and-push
    runs-on: [self-hosted, vps-staging]
    steps:
      - name: Eksekusi Update Container & Prisma Migration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}
        run: |
          cd /var/www/docker-staging
          
          # 1. Generate .env persis seperti variabel di docker-compose.staging.yml
          cat <<EOF > .env
          DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          DATABASE_URL=$DATABASE_URL
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          BETTER_AUTH_URL=$BETTER_AUTH_URL
          BETTER_AUTH_TRUSTED_ORIGINS=$BETTER_AUTH_TRUSTED_ORIGINS
          EOF

          # 2. Amankan izin akses file .env
          chmod 600 .env

          # 3. Login & Pull Image
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker compose --env-file .env -f docker-compose.staging.yml pull
          
          # 4. Jalankan Migrasi Prisma
          docker compose --env-file .env -f docker-compose.staging.yml run --rm web_app npx prisma migrate deploy
          
          # 5. Jalankan Service Utama
          docker compose --env-file .env -f docker-compose.staging.yml up -d
          
          # 6. Bersihkan image gantung
          docker image prune -f