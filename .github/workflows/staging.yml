name: Staging Deployment

on:
  push:
    branches:
      - staging

jobs:
  # 1. Build & Push Image ke Docker Hub (Dijalankan di Cloud GitHub)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sistem-surat:staging
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Deploy Langsung dari VPS (Dijalankan oleh Runner Lokal)
  deploy:
    name: Pembaruan Container di VPS
    needs: build-and-push
    runs-on: [self-hosted, vps-staging]
    steps:
      - name: Eksekusi Update Container & Prisma Migration
        run: |
          cd /var/www/docker-staging

          # 1. Bersihkan artefak lama agar disk VPS tidak penuh
          find "$HOME/actions-runner/_diag" -type f -mtime +7 -delete 2>/dev/null || true
          docker container prune -f --filter "until=24h"
          docker image prune -af --filter "until=24h"
          docker builder prune -af --filter "until=24h"

          # 2. Login ke Docker Hub
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          # 3. Pull image terbaru (Docker Compose otomatis membaca .env lokal VPS)
          docker compose -f docker-compose.staging.yml pull

          # 4. Jalankan/Update Container
          docker compose -f docker-compose.staging.yml up -d

          # 5. Eksekusi migrasi Prisma di dalam container web_app yang sudah berjalan
          DATABASE_URL_VAL=$(grep '^DATABASE_URL=' .env | cut -d '=' -f2-)
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.staging.yml exec -T -e DATABASE_URL="$DATABASE_URL_VAL" web_app npx prisma migrate deploy; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "Prisma migration failed after waiting for database readiness."
              exit 1
            fi

            echo "Database is not ready yet. Retrying migration in 2 seconds... ($attempt/30)"
            sleep 2
          done

          # 6. Bersihkan image lama
          docker image prune -f
