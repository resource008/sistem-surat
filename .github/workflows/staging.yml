name: Staging Deployment

on:
  push:
    branches:
      - staging

jobs:
  # 1. Build & Push Image ke Docker Hub (Dijalankan di Cloud GitHub)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sistem-surat:staging
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Deploy Langsung dari VPS (Dijalankan oleh Runner Lokal)
  deploy:
    name: Pembaruan Container di VPS
    needs: build-and-push
    runs-on: [self-hosted, vps-staging]
    steps:
      - name: Eksekusi Update Container & Prisma Migration
        run: |
          cd /var/www/docker-staging

          # 1. Login ke Docker Hub
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          # 2. Pull image terbaru (Docker Compose otomatis membaca .env lokal VPS)
          docker compose -f docker-compose.staging.yml pull

          # 3. Jalankan/Update Container
          docker compose -f docker-compose.staging.yml up -d

          # 4. Eksekusi migrasi Prisma di dalam container web_app yang sudah berjalan
          DATABASE_URL_VAL=$(grep '^DATABASE_URL=' .env | cut -d '=' -f2-)
          docker compose -f docker-compose.staging.yml exec -T web_app npx prisma migrate deploy

          # 5. Bersihkan image lama
          docker image prune -f