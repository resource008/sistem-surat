name: Validasi Code

on:
  push:
    branches:
      - staging
      - main
      - dev
  pull_request:
    branches:
      - staging
      - main
      - dev

jobs:
  validate:
    name: Validasi Code
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}"
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: "http://localhost:3001"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Periksa code dengan ESLint
        run: npm run lint

      - name: Periksa dengan TypeScript
        run: npx tsc --noEmit

      - name: Build aplikasi Next.js
        run: npm run build

      - name: Pengecekan berhasil
        run: echo "Semua pengecekan berhasil! Tidak ada error yang ditemukan."