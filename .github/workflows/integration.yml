name: Review Pull Request

on:
  pull_request:
    branches: [ "main" ]

jobs:
  integration-check:
    name: Strict Integration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # Mengecek kerentanan keamanan pada package yang diinstal
      - name: Security Audit
        run: npm audit --audit-level=high || true

      - name: Run Linter
        run: npm run lint

      - name: Build Application
        run: npm run build