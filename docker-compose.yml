version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: db-surat
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-dev:
    image: node:22-alpine
    container_name: nextjs-sistem-surat-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    env_file:
      - .env
    command: sh -c "apk add --no-cache openssl && npm install --legacy-peer-deps && npx prisma generate && npx prisma db push && npm run dev"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: