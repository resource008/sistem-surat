services:
  db:
    image: postgres:16-alpine
    container_name: db-surat
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sistem_surat
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistem_surat"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-dev:
    build:
      context: .
      target: development
    container_name: nextjs-sistem-surat-dev
    restart: unless-stopped
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/sistem_surat
      BETTER_AUTH_SECRET: dev-secret-change-before-production-123456
      BETTER_AUTH_URL: http://localhost:3001
      SEED_ON_START: "false"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  node_modules:
  next_cache:
