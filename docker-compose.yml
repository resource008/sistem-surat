services:
  db:
    image: postgres:18-alpine
    container_name: db_surat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-sistem_surat}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: sistem-surat-app:latest
    build:
      context: .
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-sistem_surat}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-build-secret}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
    container_name: app_surat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-sistem_surat}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
    ports:
      - "${APP_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: sistem-surat-app:latest
    build:
      context: .
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-sistem_surat}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-build-secret}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
    profiles:
      - tools
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-sistem_surat}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npm run seed"]

volumes:
  db_data:
