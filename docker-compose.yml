version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: db-surat
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: db_surat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db_surat"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        - DATABASE_URL=postgresql://admin:123456789@db:5432/db_surat?schema=public
        - BETTER_AUTH_SECRET=14UyHC272dtKJaryzE8I1eHep0jax9+bgSjHxUZLUXg=
        - BETTER_AUTH_URL=http://localhost:3001
    container_name: nextjs-sistem-surat
    restart: always
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://admin:123456789@db:5432/db_surat?schema=public
      - BETTER_AUTH_SECRET=14UyHC272dtKJaryzE8I1eHep0jax9+bgSjHxUZLUXg=
      - BETTER_AUTH_URL=http://localhost:3001
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: